<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B4FE8"/>
      <stop offset="100%" style="stop-color:#3D34C4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="rgba(255,255,255,0.07)"/>

  <!-- Logo mark -->
  <circle cx="160" cy="180" r="52" fill="rgba(255,255,255,0.15)"/>
  <text x="160" y="196" text-anchor="middle" font-size="44" fill="white">🎓</text>

  <!-- Title -->
  <text x="240" y="165" font-family="Georgia, serif" font-size="52" font-weight="900" fill="white">TutorApp Gulf</text>
  <text x="240" y="210" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.75)">tutorapp.online</text>

  <!-- Tagline -->
  <text x="100" y="320" font-family="Georgia, serif" font-size="56" font-weight="900" fill="white">Find a verified tutor</text>
  <text x="100" y="390" font-family="Georgia, serif" font-size="56" font-weight="900" fill="#0ABFA3">in UAE &amp; the Gulf</text>

  <!-- Sub -->
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)">Post a request · Receive offers · Pay after the lesson</text>

  <!-- Badges -->
  <rect x="100" y="500" width="200" height="50" rx="25" fill="rgba(255,255,255,0.15)"/>
  <text x="200" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">🇦🇪 UAE</text>
  <rect x="320" y="500" width="220" height="50" rx="25" fill="rgba(255,255,255,0.15)"/>
  <text x="430" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">🇸🇦 Saudi Arabia</text>
  <rect x="560" y="500" width="180" height="50" rx="25" fill="rgba(255,255,255,0.15)"/>
  <text x="650" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">🇶🇦 Qatar</text>
</svg>
