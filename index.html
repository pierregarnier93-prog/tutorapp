<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B4FE8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TutorApp" />

    <title>TutorApp Gulf – Find a Verified Tutor in UAE, Free for Parents</title>
    <meta name="description" content="Find a verified private tutor in Dubai, Abu Dhabi and across the Gulf. Free for parents — no commission. AI matches your child to the right tutor in minutes." />
    <meta name="keywords" content="tutor UAE, tutor Dubai, private lessons Gulf, online tutor, maths tutor Dubai, tutor Saudi Arabia, cours particuliers Dubai, IB tutor Dubai, IGCSE tutor UAE, مدرس خصوصي الإمارات" />
    <link rel="canonical" href="https://tutorapp.online/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutorapp.online/" />
    <meta property="og:title" content="TutorApp Gulf – Find a Verified Tutor, Free for Parents" />
    <meta property="og:description" content="Free for parents — no commission, no booking fee. AI matches your child to the right verified tutor in minutes. Pay only after the lesson." />
    <meta property="og:image" content="https://tutorapp.online/og-image.svg" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:locale:alternate" content="ar_AE" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TutorApp Gulf – Find a Verified Tutor, Free for Parents" />
    <meta name="twitter:description" content="Free for parents — no commission. AI matches your child to the right verified tutor in minutes." />
    <meta name="twitter:image" content="https://tutorapp.online/og-image.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TutorApp Gulf",
      "url": "https://tutorapp.online",
      "description": "Marketplace connecting students with verified tutors in UAE, Saudi Arabia, Qatar and the Gulf.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tutorapp.online/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TutorApp Gulf",
      "url": "https://tutorapp.online",
      "logo": "https://tutorapp.online/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@tutorapp.online",
        "contactType": "customer support"
      },
      "areaServed": ["AE", "SA", "QA", "KW", "BH", "OM"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Private tutor matching",
      "serviceType": "Tutoring marketplace",
      "provider": { "@type": "Organization", "name": "TutorApp Gulf" },
      "areaServed": ["AE", "SA", "QA", "KW", "BH", "OM"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "AED",
        "description": "Finding and booking a tutor is free for parents. No commission and no booking fee."
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does a private tutor cost in Dubai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tutors on TutorApp set their own rates, typically between 100 and 300 AED per hour depending on subject, level and experience. TutorApp adds nothing on top — there is no commission and no booking fee, so the rate you see is what you pay."
          }
        },
        {
          "@type": "Question",
          "name": "Is TutorApp free for parents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Posting a request, receiving offers and booking a lesson are all free. TutorApp earns from tutor subscriptions, not from parents."
          }
        },
        {
          "@type": "Question",
          "name": "Are the tutors verified?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every tutor submits an identity document and diploma, which are reviewed before their profile is published. Tutors based in the UAE must also provide the official UAE tutoring permit."
          }
        },
        {
          "@type": "Question",
          "name": "When do I pay for a lesson?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your card is authorised when you book but only charged after the lesson has taken place. A lesson cancelled more than 24 hours in advance is not charged."
          }
        },
        {
          "@type": "Question",
          "name": "Which curricula are covered?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "British (IGCSE, A-Level), American, IB, French (MEN) and the UAE national curriculum, taught in English, Arabic or French."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
