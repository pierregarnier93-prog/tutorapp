<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B4FE8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TutorApp" />

    <title>TutorApp Gulf – Find a Tutor in UAE, Saudi Arabia & Gulf</title>
    <meta name="description" content="Find verified tutors in UAE, Saudi Arabia, Qatar and the Gulf. Post a request, receive offers in minutes, pay only after the lesson. Maths, Sciences, Arabic, French, English." />
    <meta name="keywords" content="tutor UAE, tutor Dubai, private lessons Gulf, online tutor, maths tutor Dubai, tutor Saudi Arabia, cours particuliers Dubai, مدرس خصوصي الإمارات" />
    <link rel="canonical" href="https://tutorapp.online/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutorapp.online/" />
    <meta property="og:title" content="TutorApp Gulf – Find a Tutor in UAE & Gulf" />
    <meta property="og:description" content="Post a request, receive tutor offers in minutes, pay only after the lesson. Verified tutors across the Gulf." />
    <meta property="og:image" content="https://tutorapp.online/og-image.svg" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:locale:alternate" content="ar_AE" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TutorApp Gulf – Find a Tutor in UAE & Gulf" />
    <meta name="twitter:description" content="Post a request, receive tutor offers in minutes, pay only after the lesson." />
    <meta name="twitter:image" content="https://tutorapp.online/og-image.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TutorApp Gulf",
      "url": "https://tutorapp.online",
      "description": "Marketplace connecting students with verified tutors in UAE, Saudi Arabia, Qatar and the Gulf.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tutorapp.online/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TutorApp Gulf",
      "url": "https://tutorapp.online",
      "logo": "https://tutorapp.online/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@tutorapp.online",
        "contactType": "customer support"
      },
      "areaServed": ["AE", "SA", "QA", "KW", "BH", "OM"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
